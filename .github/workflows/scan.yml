name: WordPress Security Scan

on:
  push:
    branches: [ main ]

jobs:
  wordpress-wpscan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Environment
        run: |
          cd docker
          docker compose up -d

      - name: Wait for WordPress to be ready
        run: sleep 60

      - name: Run WPScan
        run: docker run --network host --rm wpscanteam/wpscan --url http://localhost:8080 --enumerate u,vp,vt --force --api-token ${{ secrets.WPSCAN_API_TOKEN }}
