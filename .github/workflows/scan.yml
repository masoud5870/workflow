name: WordPress Security Scan

on:
  push:
    branches: [ main ]

jobs:
  wordpress-wpscan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Environment
        run: |
          cd docker
          cat << 'EOF' > docker-compose.yml
          version: '3.8'
          services:
            db:
              image: mysql:5.7
              container_name: wp-db
              restart: always
              environment:
                MYSQL_ROOT_PASSWORD: password
                MYSQL_DATABASE: wordpress
                MYSQL_USER: wpuser
                MYSQL_PASSWORD: wppass
            wordpress:
              build:.
              container_name: wp-site
              depends_on:
                - db
              ports:
                - "8080:80"
              environment:
                WORDPRESS_DB_HOST: db:3306
                WORDPRESS_DB_USER: wpuser
                WORDPRESS_DB_PASSWORD: wppass
                WORDPRESS_DB_NAME: wordpress
          EOF
          docker compose up -d

      - name: Wait for WordPress to be ready
        run: sleep 60

      - name: Run WPScan
        run: |
          # استفاده از --network host و localhost برای حل مشکل شبکه در محیط لینوکس
          docker run --network host --rm wpscanteam/wpscan --url http://localhost:8080 --enumerate u,vp,vt --force --api-token ${{ secrets.WPSCAN_API_TOKEN }}
